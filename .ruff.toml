# --- Ruff configuration ------------------------------------------------------
#
# Ruff is the only linter and formatter in this project. It replaces flake8,
# isort, pyupgrade, bandit, pydocstyle and black, so none of those should be
# added separately. Notebooks are linted too — see extend-include below.
#
# Related files:
#   - .mypy.ini                type checking, deliberately kept separate
#   - .editorconfig            the same line length, for editors
#
# Recipes: `just lint`, `just fix`, `just check`.


# --- Global settings ---------------------------------------------------------
# Apply to both the linter and the formatter.

target-version = "py312"  # Lowest supported version; see requires-python.
line-length = 99
indent-width = 4
preview = false  # Preview rules are opt-in; keep the rule set reproducible.

# Jupyter notebooks are the deliverable of every laboratory work, so they are
# linted and formatted like any other source file.
extend-include = ["*.ipynb"]


# --- File selection ----------------------------------------------------------
# Paths that are not our source code. Everything else is linted.

exclude = [
    ".git",
    ".ipynb_checkpoints",
    "__pycache__",
    "build",
    "data",
    "dist",
    "*.egg-info",
    "venv",
    ".venv",
]

# Without this, exclude is ignored for paths passed explicitly on the command
# line — which is exactly how editors and hooks invoke ruff.
force-exclude = true


# --- Lint rules --------------------------------------------------------------
# Everything is enabled, then narrowed down. A new ruff release adds its rules
# automatically, which is the point: opt out consciously, not by omission.

[lint]
select = ["ALL"]

# Sorted alphabetically so the list stays searchable. Do not add rules that the
# pydocstyle convention already disables (D203, D213, D401, D404, D405) — that
# is dead configuration.
ignore = [
    "A002", "A003", "A005",  # Shadowing builtins is acceptable in narrow scopes.
    "ANN401",  # `Any` is sometimes the honest annotation.
    "ARG005",  # Unused lambda argument, common in callbacks.
    "COM812",  # Conflicts with the formatter.
    "CPY001",  # No copyright header per file.
    "D100", "D104", "D105", "D106", "D107",  # Docstrings on modules, packages, magic methods.
    "EM101", "EM102",  # String literals passed directly to exceptions.
    "FBT001", "FBT002",  # Boolean positional arguments.
    "FIX002",  # TODO comments are allowed to exist.
    "G004",  # f-strings in logging calls.
    "ISC001",  # Conflicts with the formatter.
    "N803", "N806",  # X, X_train and y are the names every ML text uses.
    "N818",  # Exception names need not end with "Error".
    "PGH003", "PGH004",  # Blanket `type: ignore` and `noqa`.
    "PLR0913", "PLR2004",  # Argument count and magic values.
    "PTH123",  # `open()` instead of `Path.open()`.
    "RET504",  # Assignment before return can aid readability.
    "RUF001", "RUF002", "RUF003",  # Ambiguous unicode; this project uses Cyrillic text.
    "TD002", "TD003",  # TODOs without author or issue link.
    "TRY003",  # Long messages inside exception constructors.
]

fixable = ["ALL"]
unfixable = []


# --- Import sorting ----------------------------------------------------------
# Replaces isort. `known-first-party` must be renamed together with the package.

[lint.isort]
known-first-party = ["mllab"]
combine-as-imports = true
force-sort-within-sections = true
no-lines-before = ["future", "standard-library"]
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]


# --- Complexity --------------------------------------------------------------

[lint.mccabe]
max-complexity = 12


# --- Line length details -----------------------------------------------------

[lint.pycodestyle]
# A long URL inside a TODO should not force an awkward line break.
ignore-overlong-task-comments = true


# --- Docstring style ---------------------------------------------------------
# Setting a convention also disables the rules that contradict it, so those
# must not appear in `ignore` above.

[lint.pydocstyle]
convention = "google"


# --- Modernisation -----------------------------------------------------------

[lint.pyupgrade]
keep-runtime-typing = false


# --- Annotations -------------------------------------------------------------

[lint.flake8-annotations]
allow-star-arg-any = true  # `*args: Any` and `**kwargs: Any` are acceptable.
mypy-init-return = true  # `__init__` may omit `-> None` when it takes arguments.


# --- Comprehensions ----------------------------------------------------------

[lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = false


# --- Quotes ------------------------------------------------------------------
# Must agree with `format.quote-style` below.

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"


# --- Import hygiene ----------------------------------------------------------

[lint.flake8-tidy-imports]
# Absolute imports only; the package is small enough that a relative import
# buys nothing and obscures where a name comes from.
ban-relative-imports = "all"


# --- Unused arguments --------------------------------------------------------

[lint.flake8-unused-arguments]
ignore-variadic-names = true


# --- Per-path relaxations ----------------------------------------------------
# Order: notebooks, then plain filename patterns.
#
# Caution: `*` crosses `/` in these patterns, so there is no way to target a
# single directory level.

[lint.per-file-ignores]
# Docstrings on public classes, methods and functions are not required. What a
# helper is for is documented once, in the plan and the README; an inline copy
# only gives the two something to drift apart on.
"src/mllab/*.py" = ["D101", "D102", "D103"]

# A notebook is a report, not a library. Its cells print, plot, re-assign `df`,
# import below the first cell and build expressions whose value is the output.
# Demanding library hygiene here would only add noise cells.
"notebooks/*.ipynb" = [
    "ANN",  # Annotations on throwaway cell-level helpers.
    "B018",  # A bare expression is how a cell renders its result.
    "D103",  # Docstrings on cell-level helpers.
    "E402",  # Imports after the introductory markdown and setup cells.
    "ERA001",  # Commented-out code is often a deliberately kept alternative.
    "INP001",  # notebooks/ is not a package and must not become one.
    "PD901",  # `df` is the conventional name for the one dataframe in scope.
    "PLR0914", "PLR0915",  # Long, linear experiment cells are easier to read.
    "S311",  # `random` is used for sampling, never for anything security related.
    "T201",  # print is an output channel of a notebook.
]

"__init__.py" = [
    "F401",  # Re-exports are the purpose of a package __init__.
    "F403",
    "I001",
    "E402",
]

"*.pyi" = [
    "ANN201",
    "ANN401",
]


# --- Formatter ---------------------------------------------------------------
# Replaces black. `quote-style` must agree with [lint.flake8-quotes].

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false  # A trailing comma keeps one item per line.
line-ending = "lf"  # Matches `* text=auto eol=lf` in .gitattributes.
docstring-code-format = true  # Format code examples inside docstrings.
docstring-code-line-length = 99
