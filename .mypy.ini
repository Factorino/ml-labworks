# --- Mypy configuration ------------------------------------------------------
#
# Effectively strict mode, written out explicitly so that each switch can be
# relaxed on its own rather than as a package. Only src/mllab is checked:
# notebooks are reports, and mypy cannot read .ipynb anyway.
#
# Caution: this is an ini file parsed by configparser. Inline comments are not
# supported — "key = True  # note" makes the value the literal string
# "True  # note" and mypy fails. Comments must occupy a whole line.
#
# Related files:
#   - .ruff.toml               linting and formatting, kept separate on purpose
#
# Recipes: `just lint`, `just check`.

[mypy]
python_version = 3.12


# --- File selection ----------------------------------------------------------
# Verbose regex, one alternative per line. Directories here are not type
# checked at all.

exclude = (?x)(
    ^build/
    | ^data/
    | ^dist/
    | ^notebooks/
    | ^venv/
    | ^\.venv/
  )


# --- Imports -----------------------------------------------------------------
# Missing stubs are an error, not a shrug: a dependency without types must be
# handled deliberately, either by a stub package in the `dev` group or by a
# narrow per-module override at the bottom of this file.

follow_imports = normal
ignore_missing_imports = False
implicit_reexport = False


# --- Required annotations ----------------------------------------------------

disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
check_untyped_defs = True


# --- Type semantics ----------------------------------------------------------
# Optional is never implicit, comparisons between unrelated types are errors,
# and a name cannot silently change its type.

no_implicit_optional = True
strict_optional = True
strict_equality = True
extra_checks = True
allow_redefinition = False
local_partial_types = True


# --- Warnings ----------------------------------------------------------------
# warn_unused_configs reports per-module sections that never matched, which is
# how a stale [mypy-<package>.*] section gets noticed.

warn_unused_configs = True
warn_return_any = True
warn_unreachable = True
warn_no_return = True


# --- Additional error codes --------------------------------------------------
# Checks that are off by default.

enable_error_code =
    redundant-self,
    redundant-cast,
    redundant-expr,
    truthy-bool,
    truthy-iterable,
    unused-awaitable,
    possibly-undefined,
    ignore-without-code,
    unused-ignore,
    explicit-override,
    mutable-override,
    unimported-reveal,
    deprecated


# --- Output ------------------------------------------------------------------

show_error_codes = True
pretty = True
color_output = True


# --- Per-module overrides ----------------------------------------------------
# The scientific stack is only partly typed. numpy, pandas (via pandas-stubs)
# and matplotlib ship or have stubs; the packages below do not, and no stub
# distribution for them is maintained. Shrugging is narrowed to exactly these
# import paths rather than enabled globally.
#
# Only packages src/mllab actually imports get a section: warn_unused_configs
# reports one that never matched, and a section added ahead of its import would
# be exactly that. So each arrives with the laboratory work that first needs
# it — sklearn with work 2, keras and tensorflow with work 7.

[mypy-sklearn.*]
ignore_missing_imports = True
